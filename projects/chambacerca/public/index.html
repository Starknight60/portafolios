<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ChambaCerca</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #080D15;
      color: #F1F5F9;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      -webkit-user-select: none;
      user-select: none;
    }
    .logo-container {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #10B981, #06B6D4);
      padding: 2px;
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.4);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-inner {
      width: 100%;
      height: 100%;
      background: #080D15;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }
    h1 {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    h1 span { color: #34D399; }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      color: #34D399;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 24px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #1E2E48;
      border-top-color: #10B981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-text {
      font-size: 13px;
      color: #94A3B8;
      max-width: 280px;
      line-height: 1.5;
    }
    .offline-box {
      display: none;
      margin-top: 24px;
      padding: 16px;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(245, 158, 11, 0.4);
      max-width: 320px;
    }
    .retry-btn {
      margin-top: 16px;
      padding: 10px 24px;
      background: #10B981;
      color: #080D15;
      font-size: 13px;
      font-weight: 800;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="logo-inner">🧭</div>
  </div>
  <h1>Chamba<span>Cerca</span></h1>
  <div class="badge">Radar de Empleo • Venezuela</div>
  
  <div class="spinner" id="loader"></div>
  <p class="status-text" id="status">Conectando con el radar de empleo en vivo...</p>

  <div class="offline-box" id="offline-box">
    <p style="color: #FCD34D; font-weight: 700; font-size: 13px; margin-bottom: 6px;">📶 Modo Callejero</p>
    <p style="color: #94A3B8; font-size: 11px;">No se detecta conexión a internet en este momento. Revisa tus datos móviles o WiFi.</p>
    <button class="retry-btn" onclick="checkAndRedirect()">Reintentar Conexión</button>
  </div>

  <script>
    const TARGET_URL = "https://chambacerca-nine.vercel.app";

    function checkAndRedirect() {
      document.getElementById('loader').style.display = 'block';
      document.getElementById('offline-box').style.display = 'none';
      document.getElementById('status').innerText = 'Conectando con el radar en vivo...';

      if (navigator.onLine) {
        window.location.replace(TARGET_URL);
      } else {
        setTimeout(() => {
          document.getElementById('loader').style.display = 'none';
          document.getElementById('offline-box').style.display = 'block';
          document.getElementById('status').innerText = 'Sin conexión de datos en la calle.';
        }, 1200);
      }
    }

    window.addEventListener('online', () => {
      window.location.replace(TARGET_URL);
    });

    // Intentar redirigir inmediatamente
    setTimeout(checkAndRedirect, 500);
  </script>
</body>
</html>
